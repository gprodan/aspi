<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMI biogaz</title>
<style>
:root{--bg:#e4e7eb;--card:#f4f6f8;--tx:#16202b;--mut:#4b5a6a;--hd:#2b3a4a;--ok:#1b7f47;--warn:#b96b00;--bad:#b3261e;--ac:#1f5fb3}
@media(prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1d252e;--tx:#e8eef4;--mut:#9fb0c2;--hd:#0b0f14;--ok:#3ec47e;--warn:#f0a020;--bad:#ff6b63;--ac:#6db1ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 system-ui,Arial,sans-serif}
header{background:var(--hd);color:#fff;padding:8px 12px;display:flex;gap:10px;align-items:center}
#alm{flex:1;padding:10px 12px;border-radius:6px;background:rgba(255,255,255,.12);min-height:44px;cursor:pointer;font-weight:700}
#alm.a1{background:#b3261e}#alm.a2{background:#b96b00}#alm.blink{animation:b .8s steps(2) infinite}@keyframes b{50%{opacity:.5}}
main{max-width:900px;margin:0 auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border-radius:10px;padding:12px;border:1px solid rgba(128,128,128,.25)}
.card h2{margin:0;font-size:14px;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}.big small{font-size:20px;color:var(--mut);font-weight:400}
.q{font-size:12px}.q.good{color:var(--ok)}.q.stale{color:var(--warn)}.q.bad{color:var(--bad)}
.bar{height:18px;background:rgba(128,128,128,.25);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
button{font:inherit;min-height:52px;min-width:52px;border-radius:8px;border:2px solid var(--mut);background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.sp{display:flex;gap:8px;align-items:center;margin-top:8px}.sp .big{flex:1;text-align:center;font-size:36px}
input{font:inherit;width:100%;min-height:48px;border-radius:8px;border:2px solid var(--mut);padding:0 10px;background:var(--bg);color:var(--tx)}
#msg{min-height:24px;margin-top:6px;font-size:15px}
ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px;border-bottom:1px solid rgba(128,128,128,.25)}
.lamp{display:inline-block;width:16px;height:16px;border-radius:50%;background:#8a949e;vertical-align:middle;margin-right:6px}.lamp.on{background:var(--ok)}
</style></head><body>
<header><b>Biogaz</b><div id="alm">…</div><span id="lnk" class="q">…</span></header>
<main>
<div class="card" id="cT"><h2><span>Temperatură TT101</span><span class="q" id="qT"></span></h2><div class="big"><span id="vT">–</span> <small>°C</small></div><div class="mut" style="font-size:14px">Încălzitor: <span id="lh" class="lamp"></span><span id="th">–</span></div></div>
<div class="card"><h2><span>Consemn SP101</span></h2>
<div class="sp"><button id="m">−</button><div class="big"><span id="vS">–</span><small> °C</small></div><button id="p">+</button></div>
<div id="pinrow" style="margin-top:8px"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"></div>
<div class="sp"><button class="p" id="apply" style="flex:1">Aplică consemnul (<span id="cand">–</span> °C)</button></div><div id="msg"></div></div>
<div class="card" id="cL"><h2><span>Nivel LT101</span></h2><div class="big"><span id="vL">–</span> <small>%</small></div><div class="bar"><i id="bL" style="width:0"></i></div></div>
<div class="card" id="cP"><h2><span>Presiune PT101</span></h2><div class="big"><span id="vP">–</span> <small>mbar</small></div><div class="bar"><i id="bP" style="width:0"></i></div></div>
<div class="card" style="grid-column:1/-1"><h2><span>Alarme și evenimente</span></h2><table id="al"></table><ul id="ev"></ul></div>
</main>
<script>
const $=id=>document.getElementById(id);let cand=null,S=null;
async function tick(){try{const r=await fetch('api/state');S=await r.json();draw()}catch(e){$('lnk').textContent='server inaccesibil';$('lnk').className='q bad'}}
function tg(n){return S.tags[n]}
function set(n,id,d,qid){const t=tg(n);$(id).textContent=t?(t.q==='bad'?'???':t.v.toFixed(d)):'n/a';if(qid)$(qid).textContent=t?t.q+' · '+t.age+' s':'';if(qid&&t)$(qid).className='q '+t.q}
function draw(){
  $('lnk').textContent=S.comm?'RTU: OK':'RTU: PIERDUT';$('lnk').className='q '+(S.comm?'good':'bad');
  set('TT101','vT',1,'qT');set('SP101','vS',1);set('LT101','vL',1);set('PT101','vP',1);
  const h=tg('HTR101'),o=tg('OUT'),oko=o&&o.q!=='bad';$('th').textContent=h?(h.q==='bad'?'???':(h.v?'ON':'OFF')):(oko?o.v.toFixed(0)+' %':'n/a');$('lh').className='lamp'+((h&&h.v&&h.q!=='bad')||(oko&&o.v>0)?' on':'');
  $('cL').style.display=tg('LT101')?'':'none';$('cP').style.display=tg('PT101')?'':'none';
  if(tg('LT101'))$('bL').style.width=tg('LT101').v+'%';if(tg('PT101'))$('bP').style.width=(tg('PT101').v/40*100)+'%';
  if(cand===null&&tg('SP101'))cand=tg('SP101').v;$('cand').textContent=cand===null?'–':cand.toFixed(1);
  $('pinrow').style.display=S.pin_required?'':'none';
  const a=S.alarms,top=a[0];const alm=$('alm');
  if(top){alm.className='a'+top.pr+(top.st==='A'?' blink':'');alm.textContent='▲ '+top.t0+'  '+top.txt+(a.length>1?'  (+'+(a.length-1)+')':'')}else{alm.className='';alm.textContent='Fără alarme active'}
  $('al').innerHTML=a.length?a.map(x=>'<tr><td>'+x.t0+'</td><td>'+x.txt+'</td><td>'+({A:'neconf.',AA:'confirmată',R:'revenită'}[x.st])+'</td></tr>').join(''):'<tr><td>Nicio alarmă activă</td></tr>';
  $('ev').innerHTML=S.events.map(e=>'<li>'+e.replace(/[<>&]/g,'')+'</li>').join('');
}
$('m').onclick=()=>{if(cand!==null){cand=Math.max(15,Math.round((cand-0.5)*10)/10);$('cand').textContent=cand.toFixed(1)}};
$('p').onclick=()=>{if(cand!==null){cand=Math.min(60,Math.round((cand+0.5)*10)/10);$('cand').textContent=cand.toFixed(1)}};
$('apply').onclick=async()=>{const r=await fetch('api/setpoint',{method:'POST',body:JSON.stringify({value:cand,pin:$('pin').value})});const j=await r.json();$('msg').textContent=j.ok?'Consemn aplicat.':'Eroare: '+j.msg;$('msg').style.color=j.ok?'var(--ok)':'var(--bad)';$('pin').value=''};
$('alm').onclick=async()=>{await fetch('api/ack',{method:'POST',body:'{}'});tick()};
tick();setInterval(tick,1000);
</script></body></html>
