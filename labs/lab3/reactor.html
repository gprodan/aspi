<script>
// ---------- Model ----------
const S={sp:60,kp:5,ki:0.3,kd:1,drain:0.2,h:10,u:0,i:0,pe:0,state:'STOP',
 xA:0.5,tset:60,rpm:80,mixer:true,heat:false,T:20,cA:0,cB:0,cP:0,hA:90,hB:90,rA:false,rB:false,tA:22,tB:18,k:0,QA:0,QB:0,dEff:0.2};
const CA0=2,CB0=2,TAMB=20;
const rho=(a,b,p,T)=>1000+45*a+30*b+60*p-0.3*(T-20);
const $=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const REC={r1:{xA:.5,tset:60,rpm:80,sp:60},r2:{xA:.65,tset:70,rpm:100,sp:55},r3:{xA:.5,tset:40,rpm:60,sp:60}};
let simT=0;
function step(dt){
  simT+=dt;let dEff=S.drain;
  if(S.state==='RUN'){
    const e=(S.sp-S.h)/100;
    S.i=S.ki>0?clamp(S.i+e*dt,-1/S.ki,1/S.ki):0;
    const d=(e-S.pe)/dt;S.pe=e;
    S.u=clamp(S.kp*e+S.ki*S.i+S.kd*d,0,1);
  }else{S.u=0;if(S.state==='ESTOP')dEff=1;}
  let QA=S.xA*0.8*S.u,QB=(1-S.xA)*0.8*S.u;
  if(S.hA<1)QA=0;if(S.hB<1)QB=0;
  const Qin=QA+QB,V=Math.max(S.h*0.1,0.3),Qout=0.12*dEff*Math.sqrt(S.h);
  const can=S.state!=='ESTOP'&&S.h>12;
  if(!can)S.heat=false;else if(S.T<S.tset-0.5)S.heat=true;else if(S.T>S.tset+0.5)S.heat=false;
  const m=S.mixer?0.5+0.5*S.rpm/120:0.3;
  S.k=0.01*Math.exp(4500*(1/293.15-1/(S.T+273.15)))*m;
  const r=S.k*S.cA*S.cB,Tin=Qin>1e-6?(QA*S.tA+QB*S.tB)/Qin:TAMB;
  S.cA=Math.max(0,S.cA+((QA*CA0-Qin*S.cA)/V-r)*dt);
  S.cB=Math.max(0,S.cB+((QB*CB0-Qin*S.cB)/V-r)*dt);
  S.cP=Math.max(0,S.cP+(-Qin*S.cP/V+r)*dt);
  S.T+=(Qin*(Tin-S.T)/V+(S.heat?10/V:0)-0.002*(S.T-TAMB))*dt;
  S.h=clamp(S.h+(Qin-Qout)*10*dt,0,100);
  S.hA=clamp(S.hA-QA*2*dt+(S.rA?1.5*dt:0),0,100);S.hB=clamp(S.hB-QB*2*dt+(S.rB?1.5*dt:0),0,100);
  if(S.hA<25)S.rA=true;if(S.hA>90)S.rA=false;if(S.hB<25)S.rB=true;if(S.hB>90)S.rB=false;
  S.tA=22+0.3*Math.sin(simT/7);S.tB=18+0.3*Math.cos(simT/9);
  S.dEff=dEff;S.QA=QA;S.QB=QB;
}
function cmd(c){
  if(c==='start'&&S.state==='STOP'){S.state='RUN';S.i=0;S.pe=(S.sp-S.h)/100;}
  else if(c==='stop'&&S.state==='RUN')S.state='STOP';
  else if(c==='estop')S.state='ESTOP';
  else if(c==='reset'&&S.state==='ESTOP')S.state='STOP';
}
function setRecipe(n){if(REC[n])Object.assign(S,REC[n]);$('rc').value=REC[n]?n:'manual';}

const colA=new THREE.Color(0x2a7de1),colB=new THREE.Color(0xe0602a),colP=new THREE.Color(0x35c46a),colW=new THREE.Color(0x3a8fd0);
function buildTank(cx,k){
 const g=new THREE.Group();g.position.x=cx;g.scale.setScalar(k);sc.add(g);
 const wall=new THREE.Mesh(new THREE.CylinderGeometry(TR,TR,TH,64,1,true),glass);wall.position.y=Y0+TH/2;g.add(wall);
 for(const [b,d] of [[Y0+TH,1],[Y0,-1]]){const p=[];for(let i=0;i<=16;i++){const a=i/16*Math.PI/2;p.push(new THREE.Vector2(TR*Math.sin(a),b+d*0.3*Math.cos(a)));}g.add(new THREE.Mesh(new THREE.LatheGeometry(p,64),steel));}
 [0,0.33,0.66,1].forEach(f=>{const t=new THREE.Mesh(new THREE.TorusGeometry(TR+0.012,0.03,10,64),steel);t.rotation.x=Math.PI/2;t.position.y=Y0+TH*f;g.add(t);});
 [Y0,Y0+TH].forEach(y=>{const f=new THREE.Mesh(new THREE.CylinderGeometry(TR+0.07,TR+0.07,0.06,64),steel);f.position.y=y;g.add(f);});
 for(let q=0;q<4;q++){const a=Math.PI/4+q*Math.PI/2,x=TR*0.8*Math.cos(a),z=TR*0.8*Math.sin(a);
  const l=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,Y0,12),paint);l.position.set(x,Y0/2,z);g.add(l);
  const fp=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,0.03,16),dark);fp.position.set(x,0.015,z);g.add(fp);}
 const water=new THREE.Mesh(new THREE.CylinderGeometry(TR-0.02,TR-0.02,1,48),new THREE.MeshPhysicalMaterial({color:0x1e88e5,transparent:true,opacity:0.72,roughness:0.1}));g.add(water);
 const surf=new THREE.Mesh(new THREE.RingGeometry(0.01,TR-0.02,48,12),new THREE.MeshStandardMaterial({color:0x58b2f5,roughness:0.05,transparent:true,opacity:0.85,side:THREE.DoubleSide}));
 surf.rotation.x=-Math.PI/2;g.add(surf);
 const pa=surf.geometry.attributes.position,rad=[];for(let i=0;i<pa.count;i++)rad.push(Math.hypot(pa.getX(i),pa.getY(i)));
 [wall,water,surf].forEach(m=>m.castShadow=false);
 return {g,water,surf,pa,rad};}
function updTank(T,h,amp,t,col){
 const wh=Math.max(h/100*TH,0.002);T.water.scale.y=wh;T.water.position.y=Y0+wh/2;T.surf.position.y=Y0+wh+0.002;
 T.water.material.color.copy(col);T.surf.material.color.copy(col).offsetHSL(0,0,0.12);
 for(let i=0;i<T.pa.count;i++)T.pa.setZ(i,amp*Math.sin(T.rad[i]*9-t*3)*T.rad[i]/TR);
 T.pa.needsUpdate=true;T.surf.geometry.computeVertexNormals();return Y0+wh;}
const tA=buildTank(-8,KF),tB=buildTank(8,KF),tF=buildTank(0,1);
// conducte
const Yv=new THREE.Vector3(0,1,0);
function pipe(a,b,r=0.1){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),20),paint);m.position.copy(A).add(B).multiplyScalar(0.5);
 m.quaternion.setFromUnitVectors(Yv,d.normalize());sc.add(m);}
function elbow(p,r=0.1){const m=new THREE.Mesh(new THREE.SphereGeometry(r*1.02,20,14),paint);m.position.set(...p);sc.add(m);}
function flange(p,axis,r=0.1){const m=new THREE.Mesh(new THREE.CylinderGeometry(r*1.9,r*1.9,0.05,24),steel);
 m.position.set(...p);if(axis==='x')m.rotation.z=Math.PI/2;if(axis==='z')m.rotation.x=Math.PI/2;sc.add(m);
 for(let i=0;i<6;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.08,6),dark),t=i/6*Math.PI*2,q=r*1.5;
  const o=axis==='x'?[0,Math.cos(t)*q,Math.sin(t)*q]:axis==='y'?[Math.cos(t)*q,0,Math.sin(t)*q]:[Math.cos(t)*q,Math.sin(t)*q,0];

 const wm=new THREE.MeshStandardMaterial({color:0xcc2222,metalness:0.3,roughness:0.5});

 for(let i=0;i<2;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.02,0.02),wm);s.rotation.y=i*Math.PI/2;wheel.add(s);}
 wheel.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.06,12),dark));

 flange([x-0.36,y,0],'x');flange([x+0.36,y,0],'x');

 g.add(new THREE.Mesh(new THREE.SphereGeometry(0.24,20,16),paint));
 const m=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.6,20),steel);m.rotation.z=Math.PI/2;m.position.set(Math.sign(-x)*0.5,-0.1,0.0);g.add(m);

const stub=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.7,8),steel);stub.rotation.z=Math.PI/2;stub.position.set(-1.15,Y0+0.3,0);sc.add(stub);
// mixer
const mx=new THREE.Group();sc.add(mx);
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.5,12),steel);shaft.position.y=3.2;mx.add(shaft);
[1.55,2.5].forEach(y=>{const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.1,12),steel);hub.position.y=y;mx.add(hub);
 for(let i=0;i<4;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.03,0.16),steel);const a=i*Math.PI/2;
  b.position.set(Math.cos(a)*0.3,y,Math.sin(a)*0.3);b.rotation.set(0.5,-a,0);mx.add(b);}});
const mot=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,0.4,24),paint);mot.position.y=4.85;sc.add(mot);
const mnt=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,0.3,20),steel);mnt.position.y=4.6;sc.add(mnt);
// jeturi
function stripe(){const c=document.createElement('canvas');c.width=16;c.height=64;const g=c.getContext('2d');g.fillStyle='#8ab';g.fillRect(0,0,16,64);
 g.fillStyle='#fff';for(let i=0;i<4;i++)g.fillRect(2+Math.random()*8,i*16,5,9);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const jm=c=>new THREE.MeshStandardMaterial({map:stripe(),color:c,transparent:true,opacity:0.88});
const mkJet=c=>new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1,12,1,true),jm(c));
const sA=mkJet(colA),sB=mkJet(colB),jet=mkJet(colW);jet.position.x=4.2;sc.add(sA,sB,jet);
const mkSp=()=>{const s=new THREE.Mesh(new THREE.RingGeometry(0.06,0.14,24),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,side:THREE.DoubleSide}));s.rotation.x=-Math.PI/2;sc.add(s);return s;};
const spA=mkSp(),spB=mkSp();
// lampă
const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.16,20,16),new THREE.MeshStandardMaterial({color:0x555555,emissive:0x000000}));
lamp.position.set(0,5.55,0);sc.add(lamp);
// afișaje 3D
function readout(x,y,z,title){const c=document.createElement('canvas');c.width=256;c.height=140;const g=c.getContext('2d'),tx=new THREE.CanvasTexture(c);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false}));s.position.set(x,y,z);s.scale.set(2.6,1.42,1);sc.add(s);
 return L=>{g.fillStyle='rgba(15,23,32,.88)';g.fillRect(0,0,256,140);g.fillStyle='#3fb6ff';g.font='bold 19px sans-serif';g.fillText(title,10,24);
  g.fillStyle='#e6edf3';g.font='17px monospace';L.forEach((l,i)=>g.fillText(l,10,50+i*22));tx.needsUpdate=true;};}
const roA=readout(-8,9.3,0,'REZERVOR A (5x)'),roB=readout(8,9.3,0,'REZERVOR B (5x)'),roF=readout(0,6.9,0,'REACTOR (final)');
sc.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
[floor,tw,scale,spMark,lvMark,sA,sB,jet,spA,spB,tA.water,tA.surf,tB.water,tB.surf,tF.water,tF.surf].forEach(m=>m.castShadow=false);
tA.g.children[0].castShadow=tB.g.children[0].castShadow=tF.g.children[0].castShadow=false;
function setValve(v,o){v.wheel.rotation.y=o*Math.PI*6;v.stem.position.y=0.55+o*0.14;v.wheel.position.y=0.82+o*0.14;v.wm.color.setHSL(0.33*o,0.7,0.4);}
let lastT=0,roT=0,hot=0;
const fmt=(h,c,d,T)=>['Nivel '+h.toFixed(0)+' %','Conc  '+c.toFixed(2)+' mol/L','Dens  '+d.toFixed(0)+' kg/m3','Temp  '+T.toFixed(1)+' C'];
function updScene(t){
  const dt=Math.min(t-lastT,0.1);lastT=t;
  updTank(tA,S.hA,0.004,t,colA);updTank(tB,S.hB,0.004,t,colB);
  const tot=S.cA+S.cB+S.cP,col=new THREE.Color();
  if(tot<0.02)col.copy(colW);else col.setRGB((colA.r*S.cA+colB.r*S.cB+colP.r*S.cP)/tot,(colA.g*S.cA+colB.g*S.cB+colP.g*S.cP)/tot,(colA.b*S.cA+colB.b*S.cB+colP.b*S.cP)/tot);
  const top=Y0+Math.max(S.h/100*TH,0.002);
  updTank(tF,S.h,0.004+0.03*(S.QA+S.QB)/0.8+0.01*(S.mixer?S.rpm/120:0),t,col);
  const len=Math.max(Y0+TH+0.15-top,0.05);
  [[sA,spA,-0.55,S.QA],[sB,spB,0.55,S.QB]].forEach(([s,sp,x,q])=>{const on=q>0.003;s.visible=sp.visible=on;
    if(on){const w=0.4+q*3;s.scale.set(w,len,w);s.position.set(x,top+len/2,0);s.material.map.repeat.set(1,len*2);s.material.map.offset.y=-t*1.5;
      sp.position.set(x,top+0.01,0);sp.scale.setScalar(1+0.3*Math.sin(t*14)+q);sp.material.opacity=0.3+0.5*q;}});
  jet.visible=S.dEff>0.02&&S.h>0.5;
  if(jet.visible){jet.material.color.copy(col);jet.scale.set(0.5+S.dEff,0.23,0.5+S.dEff);jet.position.set(4.2,0.285,0);jet.material.map.offset.y=-t*1.5;}
  setValve(vA,S.u*S.xA);setValve(vB,S.u*(1-S.xA));setValve(vOut,S.dEff);
  spMark.position.y=Y0+S.sp/100*TH;lvMark.position.y=Y0+S.h/100*TH;
  mx.rotation.y+=(S.mixer?S.rpm/60*Math.PI*2*0.25:0)*dt;
  hot+=((S.heat?1:0)-hot)*Math.min(1,dt*3);coilMat.emissive.setRGB(hot,hot*0.2,0);coilMat.emissiveIntensity=1.5;
  led.material.color.set(S.heat?0xff3322:0x333333);led.material.emissive.set(S.heat?0xff2200:0x000000);
  const c=S.state==='RUN'?0x2ecc71:S.state==='ESTOP'?0xff2222:0x666666;
  lamp.material.color.set(c);lamp.material.emissive.set(S.state==='STOP'?0x000000:c);
  if(t-roT>0.25){roT=t;
    roA(fmt(S.hA,CA0,rho(CA0,0,0,S.tA),S.tA));roB(fmt(S.hB,CB0,rho(0,CB0,0,S.tB),S.tB));
    const L=fmt(S.h,S.cP,rho(S.cA,S.cB,S.cP,S.T),S.T);L[1]='Prod  '+S.cP.toFixed(2)+' mol/L';roF(L.concat(['Rez. '+(S.heat?'PORNITA':'oprita')+' / '+S.tset+' C']).slice(0,5));}
}
// ---------- UI ----------
const hist=[];
const MAP={sp:'sp',kp:'kp',ki:'ki',kd:'kd',xa:'xA',ts:'tset',rp:'rpm'};
function ui(){
  $('vsp').textContent=S.sp.toFixed(1)+' %';$('vh').textContent=S.h.toFixed(1)+' %';
  $('vkp').textContent=S.kp.toFixed(1);$('vki').textContent=S.ki.toFixed(2);$('vkd').textContent=S.kd.toFixed(1);
  $('vdr').textContent=(S.drain*100).toFixed(0)+' %';$('vu').textContent=(S.u*100).toFixed(0)+' %';
  $('vxa').textContent='A '+(S.xA*100).toFixed(0)+' % : B '+((1-S.xA)*100).toFixed(0)+' %';
  $('vts').textContent=S.tset+' °C';$('vrp').textContent=S.rpm+' rpm';
  const st=$('st');st.className=S.state;st.textContent={RUN:'ÎN FUNCȚIUNE',STOP:'OPRIT',ESTOP:'OPRIRE DE URGENȚĂ'}[S.state];
  $('be').textContent=S.state==='ESTOP'?'RESET AU':'AU';$('bm').textContent='MIXER: '+(S.mixer?'ON':'OFF');
  for(const id in MAP)if(document.activeElement!==$(id))$(id).value=S[MAP[id]];
  if(document.activeElement!==$('dr'))$('dr').value=S.drain;
  const row=(n,h,c,d,T)=>'<td>'+n+'</td><td>'+h.toFixed(0)+'</td><td>'+c.toFixed(2)+'</td><td>'+d.toFixed(0)+'</td><td>'+T.toFixed(1)+'</td>';
  $('ra').innerHTML=row('A',S.hA,CA0,rho(CA0,0,0,S.tA),S.tA);$('rb').innerHTML=row('B',S.hB,CB0,rho(0,CB0,0,S.tB),S.tB);
  $('rf').innerHTML=row('Final',S.h,S.cP,rho(S.cA,S.cB,S.cP,S.T),S.T);
  $('mx').textContent='Reactor: A '+S.cA.toFixed(2)+' | B '+S.cB.toFixed(2)+' | P '+S.cP.toFixed(2)+' mol/L; k_ef '+S.k.toFixed(3)+'; rezistență '+(S.heat?'PORNITĂ':'oprită')+(S.rA||S.rB?'; reumplere '+(S.rA?'A ':'')+(S.rB?'B':''):'');
}
for(const id in MAP)$(id).oninput=e=>{S[MAP[id]]=+e.target.value;if(id!=='sp'&&id[0]!=='k')$('rc').value='manual';};
$('dr').oninput=e=>S.drain=+e.target.value;
$('rc').onchange=e=>setRecipe(e.target.value);
$('bm').onclick=()=>S.mixer=!S.mixer;
$('bs').onclick=()=>cmd('start');$('bt').onclick=()=>cmd('stop');
$('be').onclick=()=>cmd(S.state==='ESTOP'?'reset':'estop');
const cx=$('ch').getContext('2d');
function chart(){const w=300,h=90;cx.clearRect(0,0,w,h);
  [['sp','#f6c344'],['h','#3fb6ff']].forEach(([k,c])=>{cx.strokeStyle=c;cx.beginPath();
    hist.forEach((p,i)=>{const x=i/300*w,y=h-p[k]/100*h;i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();});}
// ---------- API extern ----------
function apply(m){
  for(const k of['sp','kp','ki','kd','drain','xA','tset','rpm'])if(typeof m[k]==='number')S[k]=k==='drain'||k==='xA'?clamp(m[k],0,1):m[k];
  if(typeof m.setpoint==='number')S.sp=clamp(m.setpoint,0,100);
  if(typeof m.mixer==='boolean')S.mixer=m.mixer;
  if(m.recipe)setRecipe(m.recipe);
  if(m.cmd)cmd(m.cmd);
}
const r2=x=>+x.toFixed(3);
const tel=()=>({t:Date.now(),state:S.state,level:r2(S.h),sp:S.sp,kp:S.kp,ki:S.ki,kd:S.kd,drain:S.drain,fill:r2(S.u),xA:S.xA,tset:S.tset,rpm:S.rpm,mixer:S.mixer,heater:S.heat,k:r2(S.k),
 A:{level:r2(S.hA),conc:CA0,rho:r2(rho(CA0,0,0,S.tA)),T:r2(S.tA)},B:{level:r2(S.hB),conc:CB0,rho:r2(rho(0,CB0,0,S.tB)),T:r2(S.tB)},
 final:{level:r2(S.h),cA:r2(S.cA),cB:r2(S.cB),cP:r2(S.cP),rho:r2(rho(S.cA,S.cB,S.cP,S.T)),T:r2(S.T)}});
window.tankAPI={set:apply,get:tel};
addEventListener('message',e=>{if(e.data&&typeof e.data==='object')apply(e.data);});
let ws=null;
$('cn').onclick=()=>{
  if(ws){ws.close();return;}
  try{ws=new WebSocket($('url').value);}catch(err){$('wst').textContent='URL invalid';ws=null;return;}
  ws.onopen=()=>{$('wst').textContent='conectat';$('cn').textContent='Deconectare';};
  ws.onmessage=e=>{try{apply(JSON.parse(e.data));}catch(_){}};
  ws.onclose=ws.onerror=()=>{$('wst').textContent='deconectat';$('cn').textContent='Conectare';ws=null;};
};
const q=new URLSearchParams(location.search).get('ws');if(q){$('url').value=q;$('cn').click();}
setInterval(()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(tel()));},200);
// ---------- Buclă ----------
let last=performance.now(),acc=0;
function loop(t){
  const dt=Math.min((t-last)/1000,0.1);last=t;
  for(let n=0;n<5;n++)step(dt/5||0.001);
  acc+=dt;if(acc>0.1){acc=0;hist.push({sp:S.sp,h:S.h});if(hist.length>300)hist.shift();}
  updScene(simT);ui();chart();R.render(sc,cam);requestAnimationFrame(loop);
}
rs();requestAnimationFrame(loop);
